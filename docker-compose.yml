version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - app-network

  celery-worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis-server:6379/0
    depends_on:
      - redis
    networks:
      - app-network

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis-server:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - CONFIG_FILE=/app/config/config.json
      - DOC_PATH=/app/my-docs
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - COLLECTION_NAME=${COLLECTION_NAME}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - CHAT_HISTORY_COLLECTION=${CHAT_HISTORY_COLLECTION}
      - USER_DOCUMENTS_COLLECTION=${USER_DOCUMENTS_COLLECTION}
      - TOPIC_COLLECTION=${TOPIC_COLLECTION}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/google-credentials.json
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
    volumes:
      - ./config:/app/config
      - ./my-docs:/app/my-docs
    depends_on:
      - redis
      - celery-worker
    networks:
      - app-network

networks:
  app-network:
    driver: bridge