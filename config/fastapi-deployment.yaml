apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-chatbot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-chatbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Máximo de pods no disponibles durante la actualización
      maxSurge: 100%          # Número máximo de pods adicionales creados durante la actualización
  template:
    metadata:
      labels:
        app: fastapi-chatbot
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox
        command: [ 'sh', '-c', 'until nc -z postgresql 5432; do echo waiting for postgres; sleep 5; done;' ]
      containers:
      - name: fastapi-chatbot
        image: orlandogtp/fastapi-chatbot:latest
        command: ["uvicorn"]
        args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: OPENAI_API_KEY
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: TAVILY_API_KEY
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_PASSWORD
        - name: CONFIG_FILE
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: CONFIG_FILE
        - name: DOC_PATH
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DOC_PATH
        - name: LANGCHAIN_PROJECT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_PROJECT
        - name: LANGCHAIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_API_KEY
        - name: LANGCHAIN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_ENDPOINT
        - name: LANGCHAIN_TRACING_V2
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_TRACING_V2
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: QDRANT_URL
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: QDRANT_API_KEY
        - name: COLLECTION_NAME
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: COLLECTION_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_NAME
        - name: DB_HOST
          value: "postgresql"  # o el nombre de tu servicio de base de datos
        - name: DB_PORT
          value: "5432"
        - name: DB_POOL_SIZE
          value: "20"
        - name: DB_MAX_OVERFLOW
          value: "10"
        - name: DB_POOL_TIMEOUT
          value: "30"