apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: orlandogtp/fastapi-chatbot:v1.1.5  # Asegúrate de usar la misma imagen que tu aplicación FastAPI
        command: ["celery"]
        args: ["-A", "app.celery_app", "worker", "--loglevel=DEBUG", "-P", "solo"]
        env:
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: REDIS_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_PASSWORD
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DB_PORT
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: OPENAI_API_KEY
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: TAVILY_API_KEY
        - name: CONFIG_FILE
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: CONFIG_FILE
        - name: DOC_PATH
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: DOC_PATH
        - name: LANGCHAIN_PROJECT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_PROJECT
        - name: LANGCHAIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_API_KEY
        - name: LANGCHAIN_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_ENDPOINT
        - name: LANGCHAIN_TRACING_V2
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: LANGCHAIN_TRACING_V2
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: QDRANT_URL
        - name: QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: QDRANT_API_KEY
        - name: COLLECTION_NAME
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: COLLECTION_NAME
        - name: GOOGLE_APPLICATION_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: GOOGLE_APPLICATION_CREDENTIALS
        - name: USER_AGENT
          valueFrom:
            secretKeyRef:
              name: chatbot-secrets
              key: USER_AGENT